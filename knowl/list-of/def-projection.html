<article class="definition definition-like"><h2 class="heading">
<span class="type">Definition</span><span class="space heading-divison-mark heading-divison-mark__space"> </span><span class="codenumber">6.25</span><span class="space heading-divison-mark heading-divison-mark__space"> </span><span class="title">Orthogonal Projection.</span>
</h2>
<div class="para">For a nonzero vector <span class="process-math">\(\vec u\)</span> and vector <span class="process-math">\(\vec v\text{,}\)</span> the <dfn class="terminology">orthogonal projection of <span class="process-math">\(\vec v\)</span> onto <span class="process-math">\(\vec u\)</span></dfn> is:<div class="autopermalink" aria-hidden="true" data-description="Paragraph"><a tabindex="-1" href="#def-projection-2-1" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>
</div>
<div class="displaymath process-math">
\begin{equation*}
\proj_{\vec u}(\vec v) = \frac{\vec v\cdot\vec u}{\vec u\cdot\vec u}\vec u.
\end{equation*}
</div>

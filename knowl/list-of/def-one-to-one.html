</h2>
<div class="para">A linear transformation <span class="process-math">\(T:\mathbb{R}^n \to \mathbb{R}^m\)</span> is <dfn class="terminology">one-to-one</dfn> if for every <span class="process-math">\(\vec b\in\mathbb{R}^m\)</span> there is at most one (possibly none) <span class="process-math">\(\vec x\in\mathbb{R}^n\)</span> such that <span class="process-math">\(T(\vec x)=\vec b\text{.}\)</span><div class="autopermalink" aria-hidden="true" data-description="Paragraph"><a tabindex="-1" href="#def-one-to-one-2-1" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>

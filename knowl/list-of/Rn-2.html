<div class="para logical">
<div class="para">Recall that <span class="process-math">\(\mathbb{R}\)</span> denotes the collection of all real numbers. For a positive integer <span class="process-math">\(n\text{,}\)</span> define</div>
<div class="displaymath process-math">
\begin{equation*}
\mathbb{R}^n = \{\text{all ordered } n\text{-tuples of real numbers } (x_1,\,x_2,\,\ldots,\,x_n)\}.
\end{equation*}

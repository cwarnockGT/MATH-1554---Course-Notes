<span class="type">Definition</span><span class="space heading-divison-mark heading-divison-mark__space"> </span><span class="codenumber">2.1</span><span class="space heading-divison-mark heading-divison-mark__space"> </span><span class="title">Zero Matrix.</span>
</h2>
<div class="para">A <dfn class="terminology">zero matrix</dfn> is any matrix whose every entry is zero.<div class="autopermalink" aria-hidden="true" data-description="Paragraph"><a tabindex="-1" href="#def-zero-matrix-2-1" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>
</div>
<div class="displaymath process-math">
\begin{equation*}
0_{2\times 3}=
\begin{bmatrix}
0 \amp 0 \amp 0\\
0 \amp 0 \amp 0
\end{bmatrix},
\qquad
0_{2\times 1}=
\begin{bmatrix}
0\\
0
\end{bmatrix}.
\end{equation*}
</div>

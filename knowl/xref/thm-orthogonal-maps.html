</h4>
<div class="para">If <span class="process-math">\(U\)</span> is an orthogonal matrix, then:<div class="autopermalink" data-description="Paragraph"><a href="#thm-orthogonal-maps-2-1" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>
</div> <ol class="lower-alpha lower-alpha-level-1" id="thm-orthogonal-maps-2-2">
<li>
<div class="para">
<em class="emphasis">Preserves angles:</em> <span class="process-math">\((U\vec x)\cdot(U\vec y)=\vec x\cdot\vec y\text{.}\)</span>
</div>
<div class="autopermalink" data-description="Item a"><a href="#thm-orthogonal-maps-2-2-1" title="Copy heading and permalink for Item a" aria-label="Copy heading and permalink for Item a">🔗</a></div>
</li>
<li>
<div class="para">
<em class="emphasis">Preserves length:</em> <span class="process-math">\(\| U\vec x\| = \|\vec x\|\text{.}\)</span>
</div>
<div class="autopermalink" data-description="Item b"><a href="#thm-orthogonal-maps-2-2-2" title="Copy heading and permalink for Item b" aria-label="Copy heading and permalink for Item b">🔗</a></div>
</li>
<li>
<div class="para"><em class="emphasis">Preserves orthogonality.</em></div>
<div class="autopermalink" data-description="Item c"><a href="#thm-orthogonal-maps-2-2-3" title="Copy heading and permalink for Item c" aria-label="Copy heading and permalink for Item c">🔗</a></div>
</li>
</ol>

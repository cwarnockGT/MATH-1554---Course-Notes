<span class="type">Theorem</span><span class="space heading-divison-mark heading-divison-mark__space"> </span><span class="codenumber">6.34</span><span class="space heading-divison-mark heading-divison-mark__space"> </span><span class="title">Mapping Properties of Orthogonal Matrices.</span>
</h2>
<div class="para">If <span class="process-math">\(U\)</span> is an orthogonal matrix, then:<div class="autopermalink" aria-hidden="true" data-description="Paragraph"><a tabindex="-1" href="#thm-orthogonal-maps-2-1" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>
</div> 
<ol class="decimal" id="thm-orthogonal-maps-2-2">
<li>
<div class="para">
<em class="emphasis">Preserves angles:</em> <span class="process-math">\((U\vec x)\cdot(U\vec y)=\vec x\cdot\vec y\text{.}\)</span>
</div>
<div class="autopermalink" aria-hidden="true" data-description="Item 1"><a tabindex="-1" href="#thm-orthogonal-maps-2-2-1" title="Copy heading and permalink for Item 1" aria-label="Copy heading and permalink for Item 1">🔗</a></div>
</li>
<li>
<div class="para">
<em class="emphasis">Preserves length:</em> <span class="process-math">\(\| U\vec x\| = \|\vec x\|\text{.}\)</span>
</div>
<div class="autopermalink" aria-hidden="true" data-description="Item 2"><a tabindex="-1" href="#thm-orthogonal-maps-2-2-2" title="Copy heading and permalink for Item 2" aria-label="Copy heading and permalink for Item 2">🔗</a></div>
</li>
<li>
<div class="para"><em class="emphasis">Preserves orthogonality.</em></div>
<div class="autopermalink" aria-hidden="true" data-description="Item 3"><a tabindex="-1" href="#thm-orthogonal-maps-2-2-3" title="Copy heading and permalink for Item 3" aria-label="Copy heading and permalink for Item 3">🔗</a></div>
</li>
</ol>
